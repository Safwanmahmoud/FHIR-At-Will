# L4 invariant pack, evaluated as FHIRPath through the validator sidecar.
#
# WHY THIS EXISTS SEPARATELY FROM L2
#
# L2 already runs the validator's own invariant checking. L4 is a *second,
# independent* evaluation of a small set of invariants we care about most, run
# through the sidecar's /fhirpath endpoint rather than its profile machinery.
# Two things fall out of that:
#
#   * A regression in profile resolution (a missing IG, a bad snapshot) cannot
#     silently disable these checks, because they do not depend on profiles.
#   * The `fb-*` rules encode this project's own non-negotiable principles as
#     machine-checkable assertions, which no off-the-shelf validator knows about.
#
# Expressions are rooted at the resource, so `status` means `Observation.status`
# when evaluated against an Observation. For a Bundle, `applies_to: [Bundle]`
# rules are evaluated against the Bundle and everything else is evaluated
# against each entry resource in turn.
#
# `applies_to: ["*"]` means every resource, including Bundle entries.

version: 1
max_evaluations: 200

invariants:
  # --- FHIR R4 base invariants ----------------------------------------
  - id: dom-2
    source: FHIR R4 base (DomainResource)
    applies_to: ["*"]
    expression: "contained.contained.empty()"
    severity: error
    human: >-
      If the resource is contained in another resource, it SHALL NOT contain
      nested Resources.

  - id: dom-4
    source: FHIR R4 base (DomainResource)
    applies_to: ["*"]
    expression: "contained.meta.versionId.empty() and contained.meta.lastUpdated.empty()"
    severity: error
    human: >-
      If a resource is contained in another resource, it SHALL NOT have a
      meta.versionId or a meta.lastUpdated.

  - id: bdl-1
    source: FHIR R4 base (Bundle)
    applies_to: ["Bundle"]
    expression: "total.empty() or (type = 'searchset') or (type = 'history')"
    severity: error
    human: "total SHALL only appear when a search or history."

  - id: bdl-2
    source: FHIR R4 base (Bundle)
    applies_to: ["Bundle"]
    expression: "entry.search.empty() or (type = 'searchset')"
    severity: error
    human: "entry.search SHALL only appear when a search."

  - id: bdl-3
    source: FHIR R4 base (Bundle)
    applies_to: ["Bundle"]
    expression: >-
      entry.all(request.exists() = (%resource.type = 'batch' or %resource.type =
      'transaction' or %resource.type = 'history'))
    severity: error
    human: >-
      entry.request is mandatory for batch/transaction/history, otherwise
      prohibited.
    # %resource is not supported by every FHIRPath host; a host that cannot
    # evaluate it yields an inconclusive result rather than a false failure.
    tolerate_evaluation_failure: true

  - id: obs-6
    source: FHIR R4 base (Observation)
    applies_to: ["Observation"]
    expression: "dataAbsentReason.empty() or value.empty()"
    severity: error
    human: >-
      dataAbsentReason SHALL only be present if Observation.value[x] is not
      present.

  - id: pat-1
    source: FHIR R4 base (Patient)
    applies_to: ["Patient"]
    expression: >-
      contact.all(name.exists() or telecom.exists() or address.exists() or
      organization.exists())
    severity: error
    human: >-
      A contact SHALL at least contain a contact's details or a reference to an
      organization.

  - id: ait-1
    source: FHIR R4 base (AllergyIntolerance)
    applies_to: ["AllergyIntolerance"]
    expression: >-
      verificationStatus.coding.where(system =
      'http://terminology.hl7.org/CodeSystem/allergyintolerance-verification' and
      code = 'entered-in-error').exists() implies clinicalStatus.empty()
    severity: error
    human: >-
      AllergyIntolerance.clinicalStatus SHALL NOT be present if
      verificationStatus is entered-in-error.

  # --- fhirbridge principles, made machine-checkable -------------------
  # These fire only on resources this service produced, which are stamped with
  # the ai-derived tag by the assemble stage (M3). They enforce principle 2.10.
  - id: fb-conservative-observation-status
    source: fhirbridge (AGENTS.md principle 2.10)
    applies_to: ["Observation"]
    expression: >-
      meta.tag.where(system = 'https://fhirbridge.org/CodeSystem/provenance-tags'
      and code = 'ai-derived').exists() implies status = 'preliminary'
    severity: warning
    human: >-
      An AI-derived Observation must carry status 'preliminary' until a human
      reviewer confirms it.

  - id: fb-conservative-condition-verification
    source: fhirbridge (AGENTS.md principle 2.10)
    applies_to: ["Condition"]
    expression: >-
      meta.tag.where(system = 'https://fhirbridge.org/CodeSystem/provenance-tags'
      and code = 'ai-derived').exists() implies
      verificationStatus.coding.where(code = 'unconfirmed').exists()
    severity: warning
    human: >-
      An AI-derived Condition must carry verificationStatus 'unconfirmed' until a
      human reviewer confirms it.

  - id: fb-conservative-medicationstatement-status
    source: fhirbridge (AGENTS.md principle 2.10)
    applies_to: ["MedicationStatement"]
    expression: >-
      meta.tag.where(system = 'https://fhirbridge.org/CodeSystem/provenance-tags'
      and code = 'ai-derived').exists() implies status = 'unknown'
    severity: warning
    human: >-
      An AI-derived MedicationStatement must carry status 'unknown' until a human
      reviewer confirms it.

  - id: fb-ai-derived-needs-provenance
    source: fhirbridge (AGENTS.md principle 2.5)
    applies_to: ["Bundle"]
    expression: >-
      entry.resource.meta.tag.where(system =
      'https://fhirbridge.org/CodeSystem/provenance-tags' and code =
      'ai-derived').exists() implies
      entry.resource.where($this.is(Provenance)).exists()
    severity: warning
    human: >-
      A Bundle containing AI-derived resources must also carry Provenance for
      them.
    tolerate_evaluation_failure: true
