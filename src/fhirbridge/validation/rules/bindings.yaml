# Curated FHIR R4 (4.0.1) terminology bindings for L3.
#
# THIS IS DELIBERATELY A SUBSET, NOT THE WHOLE SPEC.
#
# L3's job is an *independent* terminology check: it re-validates codes against
# the terminology server this deployment is configured to trust, rather than
# whichever server the validator sidecar happens to use internally. Reproducing
# every binding in R4 plus every IG here would be both unmaintainable and a lie
# waiting to happen, so instead:
#
#   * paths listed here are checked, and a `required` binding that cannot be
#     confirmed is a blocking error;
#   * paths NOT listed here are reported as deferred to L2, which does have the
#     full StructureDefinition set loaded.
#
# The report always states how many bindings were checked and how many were
# deferred, so a reader never has to guess whether silence means "passed" or
# "not looked at". See docs/evaluation.md.
#
# Coverage priority is the four M3 resource types (Condition,
# MedicationStatement, AllergyIntolerance, Observation) plus Patient and Bundle,
# because those are the ones this service will actually emit.

version: 1

bindings:
  # --- Bundle -----------------------------------------------------------
  - path: Bundle.type
    value_set: http://hl7.org/fhir/ValueSet/bundle-type
    strength: required
    kind: primitive_code
  - path: Bundle.entry.request.method
    value_set: http://hl7.org/fhir/ValueSet/http-verb
    strength: required
    kind: primitive_code

  # --- Patient ----------------------------------------------------------
  - path: Patient.gender
    value_set: http://hl7.org/fhir/ValueSet/administrative-gender
    strength: required
    kind: primitive_code
  - path: Patient.link.type
    value_set: http://hl7.org/fhir/ValueSet/link-type
    strength: required
    kind: primitive_code
  - path: Patient.maritalStatus
    value_set: http://hl7.org/fhir/ValueSet/marital-status
    strength: extensible
    kind: codeable_concept

  # --- Condition --------------------------------------------------------
  - path: Condition.clinicalStatus
    value_set: http://hl7.org/fhir/ValueSet/condition-clinical
    strength: required
    kind: codeable_concept
  - path: Condition.verificationStatus
    value_set: http://hl7.org/fhir/ValueSet/condition-ver-status
    strength: required
    kind: codeable_concept
  - path: Condition.category
    value_set: http://hl7.org/fhir/ValueSet/condition-category
    strength: extensible
    kind: codeable_concept
  - path: Condition.severity
    value_set: http://hl7.org/fhir/ValueSet/condition-severity
    strength: preferred
    kind: codeable_concept

  # --- AllergyIntolerance (a critical domain: AGENTS.md 10) -------------
  - path: AllergyIntolerance.clinicalStatus
    value_set: http://hl7.org/fhir/ValueSet/allergyintolerance-clinical
    strength: required
    kind: codeable_concept
  - path: AllergyIntolerance.verificationStatus
    value_set: http://hl7.org/fhir/ValueSet/allergyintolerance-verification
    strength: required
    kind: codeable_concept
  - path: AllergyIntolerance.type
    value_set: http://hl7.org/fhir/ValueSet/allergy-intolerance-type
    strength: required
    kind: primitive_code
  - path: AllergyIntolerance.category
    value_set: http://hl7.org/fhir/ValueSet/allergy-intolerance-category
    strength: required
    kind: primitive_code
  - path: AllergyIntolerance.criticality
    value_set: http://hl7.org/fhir/ValueSet/allergy-intolerance-criticality
    strength: required
    kind: primitive_code
  - path: AllergyIntolerance.reaction.severity
    value_set: http://hl7.org/fhir/ValueSet/reaction-event-severity
    strength: required
    kind: primitive_code

  # --- Observation ------------------------------------------------------
  - path: Observation.status
    value_set: http://hl7.org/fhir/ValueSet/observation-status
    strength: required
    kind: primitive_code
  - path: Observation.category
    value_set: http://hl7.org/fhir/ValueSet/observation-category
    strength: preferred
    kind: codeable_concept
  - path: Observation.dataAbsentReason
    value_set: http://hl7.org/fhir/ValueSet/data-absent-reason
    strength: extensible
    kind: codeable_concept
  - path: Observation.component.dataAbsentReason
    value_set: http://hl7.org/fhir/ValueSet/data-absent-reason
    strength: extensible
    kind: codeable_concept

  # --- MedicationStatement / MedicationRequest -------------------------
  - path: MedicationStatement.status
    value_set: http://hl7.org/fhir/ValueSet/medication-statement-status
    strength: required
    kind: primitive_code
  - path: MedicationRequest.status
    value_set: http://hl7.org/fhir/ValueSet/medicationrequest-status
    strength: required
    kind: primitive_code
  - path: MedicationRequest.intent
    value_set: http://hl7.org/fhir/ValueSet/medicationrequest-intent
    strength: required
    kind: primitive_code

  # --- Other resources this service reads or emits ---------------------
  - path: Encounter.status
    value_set: http://hl7.org/fhir/ValueSet/encounter-status
    strength: required
    kind: primitive_code
  - path: Procedure.status
    value_set: http://hl7.org/fhir/ValueSet/event-status
    strength: required
    kind: primitive_code
  - path: Immunization.status
    value_set: http://hl7.org/fhir/ValueSet/immunization-status
    strength: required
    kind: primitive_code
  - path: DocumentReference.status
    value_set: http://hl7.org/fhir/ValueSet/document-reference-status
    strength: required
    kind: primitive_code
  - path: Provenance.entity.role
    value_set: http://hl7.org/fhir/ValueSet/provenance-entity-role
    strength: required
    kind: primitive_code
  - path: OperationOutcome.issue.severity
    value_set: http://hl7.org/fhir/ValueSet/issue-severity
    strength: required
    kind: primitive_code
  - path: OperationOutcome.issue.code
    value_set: http://hl7.org/fhir/ValueSet/issue-type
    strength: required
    kind: primitive_code

# Unit systems whose codes are validated as units rather than concepts.
unit_systems:
  - http://unitsofmeasure.org
