# L5 plausibility rule pack.
#
# ===========================================================================
# THIS LAYER FLAGS THE IMPOSSIBLE, NOT THE ABNORMAL.
# ===========================================================================
#
# A heart rate of 190 /min is abnormal; a heart rate of 1900 /min is impossible
# and means something went wrong in extraction, unit handling or transcription.
# L5 only ever reports the second kind.
#
# That line is not stylistic. Flagging abnormal-but-possible values would make
# this clinical decision support, which AGENTS.md principle 2.9 forbids outright:
# no diagnosis, no risk scoring, no clinical interpretation. Ranges below are
# therefore set at the edges of human physiology (and beyond), deliberately wide
# enough that no real patient value falls outside them.
#
# Severity is configurable per deployment; the defaults are chosen so that a
# value which is almost certainly a data error blocks, and a value which is
# merely suspicious warns.

version: 1

defaults:
  future_date_tolerance_days: 1

rules:
  # --- Vital signs: unit-scoped physiologic bounds ---------------------
  - id: fb-plaus-heart-rate
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|8867-4"]
    expected_unit: "/min"
    min: 5
    max: 400
    severity: error
    message: "Heart rate outside the range of human physiology."

  - id: fb-plaus-systolic-bp
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|8480-6"]
    expected_unit: "mm[Hg]"
    min: 20
    max: 350
    severity: error
    message: "Systolic blood pressure outside the range of human physiology."

  - id: fb-plaus-diastolic-bp
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|8462-4"]
    expected_unit: "mm[Hg]"
    min: 5
    max: 250
    severity: error
    message: "Diastolic blood pressure outside the range of human physiology."

  - id: fb-plaus-body-temperature
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|8310-5", "http://loinc.org|8331-1"]
    expected_unit: "Cel"
    min: 20
    max: 45
    severity: error
    message: >-
      Body temperature outside the range of human physiology. A value near 98
      suggests degrees Fahrenheit recorded with a Celsius unit.

  - id: fb-plaus-respiratory-rate
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|9279-1"]
    expected_unit: "/min"
    min: 2
    max: 150
    severity: error
    message: "Respiratory rate outside the range of human physiology."

  - id: fb-plaus-oxygen-saturation
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|2708-6", "http://loinc.org|59408-5"]
    expected_unit: "%"
    min: 10
    max: 100
    severity: error
    message: >-
      Oxygen saturation must be a percentage between 10 and 100. A value above
      100 is impossible.

  - id: fb-plaus-body-weight
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|29463-7", "http://loinc.org|3141-9"]
    expected_unit: "kg"
    min: 0.2
    max: 700
    severity: error
    message: >-
      Body weight outside the plausible range in kilograms. A value in the
      hundreds may be pounds recorded with a kilogram unit.

  - id: fb-plaus-body-height
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|8302-2"]
    expected_unit: "cm"
    min: 20
    max: 280
    severity: error
    message: >-
      Body height outside the plausible range in centimetres. A value under 10
      may be metres, and a value near 70 may be inches.

  - id: fb-plaus-bmi
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|39156-5"]
    expected_unit: "kg/m2"
    min: 5
    max: 200
    severity: warning
    message: "Body mass index outside the plausible range."

  # --- Common laboratory results ---------------------------------------
  - id: fb-plaus-hemoglobin
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|718-7"]
    expected_unit: "g/dL"
    min: 1
    max: 30
    severity: warning
    message: >-
      Haemoglobin outside the plausible range in g/dL. A value near 100 may be
      g/L recorded with a g/dL unit.

  - id: fb-plaus-creatinine
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|2160-0"]
    expected_unit: "mg/dL"
    min: 0.05
    max: 30
    severity: warning
    message: "Serum creatinine outside the plausible range in mg/dL."

  - id: fb-plaus-glucose
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|2345-7", "http://loinc.org|2339-0"]
    expected_unit: "mg/dL"
    min: 5
    max: 2000
    severity: warning
    message: "Glucose outside the plausible range in mg/dL."

  - id: fb-plaus-sodium
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|2951-2", "http://loinc.org|2947-0"]
    expected_unit: "mmol/L"
    min: 80
    max: 220
    severity: warning
    message: "Serum sodium outside the plausible range in mmol/L."

  - id: fb-plaus-potassium
    kind: quantity_range
    applies_to: [Observation]
    codes: ["http://loinc.org|2823-3", "http://loinc.org|6298-4"]
    expected_unit: "mmol/L"
    min: 0.5
    max: 12
    severity: warning
    message: "Serum potassium outside the plausible range in mmol/L."

  # --- Negative-value sanity -------------------------------------------
  - id: fb-plaus-no-negative-magnitudes
    kind: non_negative_quantity
    applies_to: [Observation]
    severity: warning
    message: >-
      A negative magnitude is implausible for this kind of measurement. Check for
      a stray minus sign or a misparsed range.

  # --- Dates ------------------------------------------------------------
  - id: fb-plaus-no-future-clinical-dates
    kind: future_date
    applies_to: ["*"]
    paths:
      - Patient.birthDate
      - Condition.onsetDateTime
      - Condition.recordedDate
      - Condition.abatementDateTime
      - Observation.effectiveDateTime
      - Observation.issued
      - AllergyIntolerance.onsetDateTime
      - AllergyIntolerance.recordedDate
      - AllergyIntolerance.lastOccurrence
      - MedicationStatement.effectiveDateTime
      - MedicationStatement.dateAsserted
      - Procedure.performedDateTime
      - Immunization.occurrenceDateTime
    severity: error
    message: "A clinical date in the future is not plausible."

  - id: fb-plaus-onset-before-recorded
    kind: date_order
    applies_to: [Condition, AllergyIntolerance]
    pairs:
      - earlier: Condition.onsetDateTime
        later: Condition.recordedDate
      - earlier: AllergyIntolerance.onsetDateTime
        later: AllergyIntolerance.recordedDate
    severity: warning
    message: "Onset is recorded after the date the record was created."

  - id: fb-plaus-abatement-after-onset
    kind: date_order
    applies_to: [Condition]
    pairs:
      - earlier: Condition.onsetDateTime
        later: Condition.abatementDateTime
    severity: error
    message: "A condition cannot resolve before it began."

  - id: fb-plaus-birth-before-clinical-events
    kind: birth_date_order
    applies_to: ["*"]
    paths:
      - Condition.onsetDateTime
      - Condition.recordedDate
      - Observation.effectiveDateTime
      - AllergyIntolerance.onsetDateTime
      - MedicationStatement.effectiveDateTime
      - Procedure.performedDateTime
      - Immunization.occurrenceDateTime
    severity: error
    message: >-
      A clinical event is dated before the patient's date of birth. Only checked
      when the subject resolves to a Patient in the same Bundle.

  # --- Medication dose sanity (a critical domain: AGENTS.md 10) --------
  - id: fb-plaus-dose-magnitude
    kind: dose_magnitude
    applies_to: [MedicationStatement, MedicationRequest, MedicationAdministration]
    limits:
      mg: 100000
      g: 100
      mcg: 100000000
      ug: 100000000
      "[iU]": 10000000
      mL: 5000
      mg/kg: 1000
    severity: error
    message: >-
      Dose magnitude is implausible for this unit. Dose is a critical domain, so
      this always requires human review.

  # --- Disabled by default: see OPEN_QUESTIONS.md#Q3 -------------------
  # Administrative gender is not a reliable proxy for anatomy: it is wrong for
  # transgender, intersex and post-surgical patients, and a false "conflict"
  # pushed to a reviewer is both a harm and a bias. Enabling this rule is a
  # deployment decision, not a default.
  - id: fb-plaus-sex-anatomy-conflict
    kind: sex_anatomy_conflict
    enabled: false
    applies_to: [Condition, Procedure, Observation]
    gender: male
    codes:
      - "http://snomed.info/sct|77386006"   # Pregnancy
      - "http://snomed.info/sct|118185001"  # Finding related to pregnancy
      - "http://snomed.info/sct|386639001"  # Termination of pregnancy
      - "http://snomed.info/sct|236958009"  # Cervical smear
    severity: information
    message: >-
      This code implies anatomy that conflicts with the recorded administrative
      gender. This may be correct for this patient; it is surfaced for review
      only, never as a correction.
