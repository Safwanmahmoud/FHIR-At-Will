version: 1

patterns:
  - id: email
    class: email
    regex: '\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
    flags: [ignorecase]
  - id: url
    class: url
    regex: '\bhttps?://[^\s<>"'']+'
    flags: [ignorecase]
  - id: ipv4
    class: ip
    regex: '\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b'
  - id: ssn
    class: ssn
    regex: '\b(?!000|666|9\d\d)\d{3}[- ]?(?!00)\d{2}[- ]?(?!0000)\d{4}\b'
  - id: phone
    class: phone
    regex: '(?<!\w)(?:\+?1[-.\s]?)?(?:\(\d{3}\)|\d{3})[-.\s]\d{3}[-.\s]\d{4}(?!\w)'
  - id: date_numeric
    class: date
    regex: '\b(?:0?[1-9]|1[0-2])[-/](?:0?[1-9]|[12]\d|3[01])[-/](?:19|20)\d{2}\b'
  - id: date_iso
    class: date
    regex: '\b(?:19|20)\d{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])\b'
  - id: date_named
    class: date
    regex: '\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(?:[1-9]|[12]\d|3[01])(?:st|nd|rd|th)?(?:,?\s+(?:19|20)\d{2})?\b'
    flags: [ignorecase]
  - id: date_month_year
    class: date
    regex: '\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(?:19|20)\d{2}\b'
    flags: [ignorecase]
  - id: zip
    class: zip
    regex: '\b\d{5}(?:-\d{4})?\b'
  - id: mrn_labeled
    class: mrn
    regex: '\b(?:MRN|medical record(?: number)?)[\s:#-]*[A-Z0-9-]{4,24}\b'
    flags: [ignorecase]
  - id: account_labeled
    class: account
    regex: '\b(?:account|acct)[\s:#-]*[A-Z0-9-]{4,24}\b'
    flags: [ignorecase]
  - id: license_labeled
    class: license
    regex: '\b(?:license|lic)[\s:#-]*[A-Z0-9-]{4,24}\b'
    flags: [ignorecase]
  - id: device_labeled
    class: device
    regex: '\b(?:serial|device|UDI)[\s:#-]*[A-Z0-9-]{4,40}\b'
    flags: [ignorecase]
  - id: age_over_89
    class: age
    regex: '\b(?:9\d|1\d{2})(?:[- ]year[- ]old|\s+years?\s+old|\s+y/?o)\b'
    flags: [ignorecase]
